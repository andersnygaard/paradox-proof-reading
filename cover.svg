<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -290 1920 1460" width="1920" height="1460">
  <title>Paradox, Matt Layden</title>
  <desc>Vector illustration after the photograph of Matt Layden aboard Paradox, sail hanging slack, seen from starboard with the bow to the right. Rig completed above the photo edge from the design: balanced lug with a short yard.</desc>
  <defs>
    <linearGradient id="sailShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eeebe5"/>
      <stop offset="0.45" stop-color="#f7f5f1"/>
      <stop offset="1" stop-color="#fcfbf9"/>
    </linearGradient>
    <linearGradient id="hullShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5f1"/>
      <stop offset="1" stop-color="#e6e2da"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask">
      <rect x="300" y="1096" width="1560" height="70" fill="url(#fade)"/>
    </mask>
    <clipPath id="sailClip">
      <path d="M 1312 -92 L 925 -190 C 902 -40 884 70 806 200 C 698 380 630 446 500 629 L 1308 730 Z"/>
    </clipPath>
  </defs>

  <rect x="-20" y="-290" width="1920" height="1460" fill="#ffffff"/>

  <!-- water: reflection of the bottom band and a few ripples -->
  <g mask="url(#reflMask)" opacity="0.28">
    <g transform="translate(0 2192) scale(1 -1)">
      <path d="M 372 1050 L 1787 1042 L 1776 1084 Q 1771 1096 1750 1096 L 420 1096 Q 396 1096 386 1080 Z" fill="#8a857e"/>
    </g>
  </g>
  <g stroke="#b9b5ae" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 290 1108 h 60"/>
    <path d="M 1820 1106 h 44"/>
    <path d="M 46 950 q 18 -6 38 0 q 20 6 40 0"/>
    <path d="M 62 964 q 14 -5 30 0"/>
  </g>

  <!-- sail (behind the mast) -->
  <path d="M 1312 -92 L 925 -190 C 902 -40 884 70 806 200 C 698 380 630 446 500 629 L 1308 730 Z"
        fill="url(#sailShade)" stroke="#5f5a53" stroke-width="2.6" stroke-linejoin="round"/>
  <g clip-path="url(#sailClip)" fill="none" stroke-linecap="round">
    <g stroke="#cfcac1" stroke-width="1.8">
      <path d="M 1309 530 Q 970 507 626 440"/>
      <path d="M 1310 320 Q 1040 303 770 250"/>
      <path d="M 1311 110 Q 1090 97 866 52"/>
    </g>
    <g stroke="#d9d4cc" stroke-width="1.5" opacity="0.6">
      <path d="M 506 622 Q 600 588 700 558"/>
      <path d="M 516 606 C 560 520 620 430 690 350"/>
      <path d="M 542 606 C 640 540 760 470 880 420"/>
      <path d="M 905 -150 C 900 60 870 220 790 330"/>
    </g>
  </g>

  <!-- yard and boom (behind the mast) -->
  <line x1="908" y1="-194" x2="1330" y2="-87" stroke="#6e5538" stroke-width="8" stroke-linecap="round"/>
  <line x1="486" y1="630" x2="1332" y2="736" stroke="#6e5538" stroke-width="7" stroke-linecap="round"/>

  <!-- hull -->
  <path d="M 370 895 Q 1100 884 1795 852 L 1787 1042 L 372 1050 Z"
        fill="url(#hullShade)" stroke="#2a2824" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 372 1050 L 1787 1042 L 1776 1084 Q 1771 1096 1750 1096 L 420 1096 Q 396 1096 386 1080 Z"
        fill="#3b3734" stroke="#2a2824" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="372" y1="1050" x2="1787" y2="1042" stroke="#2a2824" stroke-width="2"/>

  <!-- name on the bow, baseline follows the sheer -->
  <text x="1420" y="921" transform="rotate(-1.96 1420 921)"
        font-family="Georgia, 'Times New Roman', Times, serif" font-weight="bold" font-size="42"
        fill="#1e1c1a" textLength="205" lengthAdjust="spacingAndGlyphs">PARADOX</text>

  <!-- stern details: rope loop on the topsides, yuloh over the stern -->
  <path d="M 435 902 C 427 914 426 928 436 933 C 446 928 445 914 437 902 Z" fill="none" stroke="#3a3632" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 82 936 L 640 793 L 640 806 L 82 945 Z" fill="#6b5a45" stroke="#3a3028" stroke-width="1"/>

  <!-- hatch: window frame with Matt standing in the opening, then the solid hatch box -->
  <polygon points="625,800 1072,800 1100,878 625,878" fill="#dfe7ec" opacity="0.6"/>
  <polygon points="714,800 893,800 886,878 718,878" fill="#3a3532" opacity="0.55"/>
  <circle cx="655" cy="862" r="18" fill="#4a4542" opacity="0.45"/>
  <g stroke="#2a2824" stroke-linecap="square" fill="none">
    <line x1="620" y1="798" x2="1072" y2="806" stroke-width="12"/>
    <line x1="625" y1="796" x2="625" y2="880" stroke-width="6"/>
    <line x1="905" y1="800" x2="905" y2="880" stroke-width="5"/>
    <line x1="955" y1="801" x2="955" y2="880" stroke-width="5"/>
    <line x1="1072" y1="802" x2="1100" y2="878" stroke-width="6"/>
    <line x1="620" y1="882" x2="1100" y2="878" stroke-width="4"/>
  </g>
  <polygon points="1072,800 1195,798 1195,878 1100,878" fill="#efece6" stroke="#2a2824" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 1192 800 L 1192 788 L 1212 788 L 1212 800" fill="none" stroke="#2a2824" stroke-width="3"/>
  <circle cx="640" cy="796" r="11" fill="#2a2522"/>

  <!-- Matt: hunched forward over the hatch, hood up, arm reaching down (silhouette traced from the photo) -->
  <path d="M 715 797
           C 710 770 710 730 716 712
           C 720 700 724 694 730 690
           C 718 672 720 640 735 622
           C 748 610 775 612 788 625
           C 800 638 800 672 792 694
           C 804 686 818 682 832 682
           C 852 686 868 704 878 724
           C 886 742 892 770 893 797
           L 830 797
           C 826 782 822 768 818 760
           C 813 770 807 784 803 797 Z"
        fill="#c4452c" stroke="#7a2a1a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 730 690 C 742 697 756 699 770 696" fill="none" stroke="#7a2a1a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 832 682 C 836 700 840 716 846 730" fill="none" stroke="#7a2a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 780 648 C 790 644 798 654 798 668 C 798 681 791 689 784 686 C 777 680 775 660 780 648 Z" fill="#e5c3a2" stroke="#8a4a32" stroke-width="1"/>

  <!-- foredeck: rod on deck, downhaul, bow cleat -->
  <line x1="1260" y1="863" x2="1410" y2="861" stroke="#3a3632" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1347" y1="853" x2="1349" y2="873" stroke="#3a3632" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1313" y1="762" x2="1264" y2="858" stroke="#4a443f" stroke-width="2"/>
  <line x1="1695" y1="848" x2="1748" y2="847" stroke="#2a2824" stroke-width="5" stroke-linecap="round"/>
  <rect x="1714" y="848" width="14" height="9" fill="#2a2824"/>

  <!-- mast in front of sail and spars -->
  <rect x="1227" y="-215" width="30" height="1081" fill="#ece8e0" stroke="#6b665f" stroke-width="2"/>
  <rect x="1224" y="-222" width="36" height="12" rx="3" fill="#3a3632"/>
  <line x1="1242" y1="-210" x2="1160" y2="-131" stroke="#4a443f" stroke-width="2"/>
  <rect x="1226" y="707" width="32" height="55" rx="3" fill="#1f1d1b"/>
  <ellipse cx="1322" cy="741" rx="17" ry="22" fill="#f6f4ef" stroke="#4a443f" stroke-width="2.5"/>
  <path d="M 1332 731 A 9 9 0 1 0 1332 751" fill="none" stroke="#4a443f" stroke-width="2"/>
</svg>
